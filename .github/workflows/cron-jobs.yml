name: Scheduled Cron Jobs
on:
  schedule:
    # Appointment reminders - every 15 minutes
    - cron: '*/15 * * * *'
    # Cleanup expired leads - daily at 3am UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  appointment-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger appointment reminders
        run: |
          curl -s -X GET "https://taxgeniuspro.tax/api/cron/appointment-reminders" || true
          echo "Appointment reminders triggered"

  send-scheduled-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Send scheduled emails
        run: |
          curl -s -X GET "https://taxgeniuspro.tax/api/cron/send-scheduled-emails" || true
          echo "Scheduled emails triggered"

  cleanup-expired-leads:
    runs-on: ubuntu-latest
    # Only run on the daily schedule (3am UTC)
    if: github.event.schedule == '0 3 * * *'
    steps:
      - name: Cleanup expired leads
        run: |
          curl -s -X GET "https://taxgeniuspro.tax/api/cron/cleanup-expired-leads" || true
          echo "Expired leads cleanup triggered"
